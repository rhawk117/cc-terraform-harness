line-length = 100
indent-width = 4
force-exclude = true
show-fixes = true

[lint]
preview = true
explicit-preview-rules = true
extend-select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "EXE",
    "F",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RSE",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "COM818",
    "ISC001",
    "PLR0904",
    "PLR0914",
    "PLR0916",
    "PLR1702",
    "PLW0717",
    "PT029",
    "pytest-fixture-autouse",
]
ignore = [
    "E111", # conflicts with the formatter, which owns indentation
    "E114", # conflicts with the formatter, which owns indentation
    "E117", # conflicts with the formatter, which owns indentation
    "W191", # conflicts with the formatter, which owns indentation
    "T201", # every print the rule reports is in the vibe-code plugin, whose CLI writes to stdout
    "any-type"
]


[lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",    # tests are written as bare assert statements
    "PLR2004", # tests compare against literal expected values
    "PLR0913", # test functions and helpers take many fixtures as arguments
    "PLR0917", # test functions and helpers take many positional fixtures
    "FBT001",  # test helpers and parametrized tests take boolean positional flags
    "TID251",  # tests write input and read output back with the standard library, independent of the codec under test
]

[lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
mypy-init-return = false
suppress-dummy-args = false
suppress-none-returning = false

[lint.flake8-bandit]
check-typed-exception = true

[lint.flake8-builtins]
strict-checking = true

[lint.flake8-import-conventions]
extend-aliases = { sqlalchemy = "sql" }
banned-from = ["sqlalchemy"]

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"
parametrize-values-type = "list"
parametrize-values-row-type = "tuple"


[lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = ["pydantic.BaseModel", "msgspec.Struct"]

# pro tip
[lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Python 3.14 already evaluates annotations lazily"
"functools.partial".msg = "Use a class with a verb method, or pass a bound method."
"functools.cached_property".msg = "Fails on slotted dataclasses and msgspec Structs; use a plain property."
"asyncio.gather".msg = "Use asyncio.TaskGroup."
"importlib.import_module".msg = "Import the module statically; dynamic imports hide dependencies from ty and readers."
"importlib.reload".msg = "Restart the process instead of reloading modules in place."
"importlib.util.spec_from_file_location".msg = "Install the code as a package and import it."
"sys.path".msg = "Install the package with uv; editing sys.path breaks editors and type checkers."
"sys.modules".msg = "Inject the dependency instead of patching the module cache."
"abc.ABC".msg = "Define a typing.Protocol."
"abc.ABCMeta".msg = "Define a typing.Protocol."
"abc.abstractmethod".msg = "Define a typing.Protocol."
"sys.exit".msg = "Return an exit code from main() and raise SystemExit(main())."
"inspect.currentframe".msg = "Pass the value explicitly instead of reading the caller's frame."
"os.execl".msg = "Run a child with asyncio.create_subprocess_exec or subprocess.run instead of replacing this process."
"os.execle".msg = "Run a child with asyncio.create_subprocess_exec or subprocess.run instead of replacing this process."
"os.execlp".msg = "Run a child with asyncio.create_subprocess_exec or subprocess.run instead of replacing this process."
"os.execlpe".msg = "Run a child with asyncio.create_subprocess_exec or subprocess.run instead of replacing this process."
"os.execv".msg = "Run a child with asyncio.create_subprocess_exec or subprocess.run instead of replacing this process."
"os.execve".msg = "Run a child with asyncio.create_subprocess_exec or subprocess.run instead of replacing this process."
"os.execvp".msg = "Run a child with asyncio.create_subprocess_exec or subprocess.run instead of replacing this process."
"os.execvpe".msg = "Run a child with asyncio.create_subprocess_exec or subprocess.run instead of replacing this process."

[lint.flake8-unused-arguments]
ignore-variadic-names = false

[lint.mccabe]
max-complexity = 8

[lint.pylint]
max-args = 3
max-positional-args = 3
max-returns = 6
max-branches = 8
max-statements = 25
max-locals = 10
max-bool-expr = 3
max-nested-blocks = 3
max-statements-in-try = 3
max-public-methods = 10


[format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
preview = true
