name: Set up Python project
description: |
  Install uv, Python, and the Claude CLI, and optionally synchronize dependency groups

inputs:
  python-version:
    description: Python version used for the project environment
    required: false
    default: "3.14"
  groups:
    required: false
    default: ""
    description: Space-separated dependency groups to synchronize; empty uses the default groups
  sync:
    required: false
    default: "true"
    description: Whether to synchronize the project environment
  enable-cache:
    required: false
    default: "true"
    description: Whether setup-uv should persist its cache
  claude-code-version:
    required: false
    default: "2.1.301"
    description: Version of @anthropic-ai/claude-code to install

runs:
  using: composite
  steps:
    - name: Install UV + Python
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        version: "0.13.1"
        python-version: ${{ inputs.python-version }}
        enable-cache: ${{ inputs.enable-cache }}
        cache-dependency-glob: uv.lock

    - name: Install Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"

    - name: Install Claude CLI
      shell: bash
      run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      env:
        CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}

    - name: Synchronize Project (UV)
      if: ${{ inputs.sync == 'true' }}
      shell: bash
      env:
        DEPENDENCY_GROUPS: ${{ inputs.groups }}
      run: |
        args=(sync --locked --all-packages)
        read -r -a groups <<< "$DEPENDENCY_GROUPS"

        if [[ ${#groups[@]} -gt 0 ]]; then
          args+=(--no-default-groups)
          for group in "${groups[@]}"; do
            args+=(--group "$group")
          done
        fi

        uv "${args[@]}"
