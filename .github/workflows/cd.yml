name: Create Release
on:
  workflow_dispatch:
    inputs:
      version-bump:
        description: Semantic version bump or recover an existing release
        type: choice
        options: [recover, patch, minor, major]
        default: recover
        required: true

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PACKAGE_NAME: tf-harness-plugin
  VERSION_BUMP: ${{ inputs.version-bump }}
  REPOSITORY_IS_FORK: ${{ github.event.repository.fork }}

jobs:
  release-guard:
    name: Validate Release Context
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify Repository and Branch
        run: |
          if [[ "$REPOSITORY_IS_FORK" != false ]]; then
            echo "::error::Releases are disabled in forks."
            exit 1
          fi

          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Releases must originate from main."
            exit 1
          fi

  continuous-integration:
    name: Run CI Pipeline
    needs: [release-guard]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prepare-release:
    name: Prepare Release
    needs: [continuous-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ vars.UV_VERSION }}
          cache-dependency-glob: uv.lock

      - name: Sync Dependencies
        run: uv sync --all-groups --locked

      - name: Prepare Release
        id: prepare
        run: bash ./.github/scripts/release.sh

  create-release:
    name: Publish GitHub Release
    needs: [prepare-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - name: Publish GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::Release already exists: ${RELEASE_TAG}"
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --title "Release $RELEASE_TAG" \
            --generate-notes \
            --verify-tag

          echo "::notice::Published GitHub Release: ${RELEASE_TAG}"
