name: release

on:
  workflow_dispatch:
    inputs:
      version-bump:
        type: choice
        options: [major, minor, patch]
        required: false
        description: |
          The optional semver version bump for the release. Omit to recover
          a release for the current version.
          v(major).(minor).(patch)

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  run-ci-pipeline:
    name: Run CI Pipeline
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prepare-release:
    name: Prepare Release
    needs: run-ci-pipeline
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION_BUMP: ${{ inputs.version-bump }}
    outputs:
      version: ${{ steps.bump.outputs.version || steps.recover.outputs.version }}
      tag: ${{ steps.bump.outputs.tag || steps.recover.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Bootstrap Runner
        uses: ./.github/actions/bootstrap

      - name: Validate Current Release
        id: current
        shell: bash
        run: |
          current_version="$(uv version --package mightymodels-plugin --short)"
          current_tag="v${current_version}"

          git rev-parse "${current_tag}" >/dev/null 2>&1 || {
            echo "::error::Previous release tag '${current_tag}' does not exist."
            exit 1
          }

          echo "version=${current_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${current_tag}" >> "${GITHUB_OUTPUT}"

      - name: Bump Release
        id: bump
        if: ${{ inputs.version-bump != '' }}
        shell: bash
        run: |
          uv version --package mightymodels-plugin --bump "${VERSION_BUMP}" --no-sync
          version="$(uv version --package mightymodels-plugin --short)"
          tag="v${version}"

          manifest=.claude-plugin/plugin.json
          jq --arg version "${version}" '.version = $version' "${manifest}" > "${manifest}.tmp"
          mv "${manifest}.tmp" "${manifest}"

          uv run pytest --no-cov -q tests/test_release_metadata.py

          {
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Use Current Release
        id: recover
        if: ${{ inputs.version-bump == '' }}
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          CURRENT_TAG: ${{ steps.current.outputs.tag }}
        shell: bash
        run: |
          echo "version=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${CURRENT_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Record Version Bump
        if: ${{ inputs.version-bump != '' }}
        env:
          RELEASE_TAG: ${{ steps.bump.outputs.tag }}
        shell: bash
        run: |
          echo "::group::Recording Version Bump"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock .claude-plugin/plugin.json
          git commit -m "release: ${RELEASE_TAG}"
          git tag "${RELEASE_TAG}"
          git push origin HEAD
          git push origin "${RELEASE_TAG}"
          echo "::endgroup::"

  create-release:
    needs: [prepare-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - name: Create GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ github.token }}
          script: |
            const { RELEASE_TAG } = process.env;
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: RELEASE_TAG,
              name: RELEASE_TAG,
              generate_release_notes: true,
            });

            core.notice(`Created release ${release.html_url}`);
