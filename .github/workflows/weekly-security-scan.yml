
name: Weekly Supply Chain Audit
on:
  workflow_dispatch:
  schedule:
    - cron: "37 8 * * 1"

permissions: {}
concurrency:
  group: weekly-security-${{ github.repository }}
  cancel-in-progress: false

jobs:
  audit-supply-chain:
    if: ${{ github.event.repository.fork != true }}
    name: Audit Python Dependencies
    uses: ./.github/workflows/supply-chain-check.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  report-security-findings:
    if: ${{ always() && !cancelled() && github.event.repository.fork != true }}
    name: Report Security Findings
    needs: [audit-supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report Audit Results
        run: bash ./.github/scripts/report-security.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUDIT_RESULT: ${{ needs.audit-supply-chain.result }}
