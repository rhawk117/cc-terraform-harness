ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

claude-config:
  - changed-files:
      - any-glob-to-any-file:
          - .claude/**
          - .claude-plugin/**

packages:
  - changed-files:
      - any-glob-to-any-file:
          - packages/**

tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**
          - conftest.py

scripts:
  - changed-files:
      - any-glob-to-any-file:
          - scripts/**
          - Makefile

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - pyproject.toml
          - packages/*/pyproject.toml
          - uv.lock
